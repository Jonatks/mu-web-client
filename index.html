<!DOCTYPE html>
<html lang="en" translate="no" spellcheck="false">

<head>
  <meta charset="UTF-8" />
  <title>MU Valhalla</title>
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0d0b0a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, minimal-ui, shrink-to-fit=no, viewport-fit=cover, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MU Valhalla" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <meta name="description" content="JS implementation of MU Online" />

  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
  <style>
    @font-face {
      font-family: 'Segoe UI';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/segoeuib.woff2') format('woff2'),
        url('/fonts/segoeuib.woff') format('woff'),
        url('/fonts/segoeuib.ttf') format('truetype');
    }
  </style>
  <style>
    :root {
      font-family: 'Segoe UI', sans-serif, Arial;
      line-height: 1.5;
      font-weight: 400;

      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body,
    html {
      color: #1f2737;
      background-color: #fafafa;
      width: 100%;
      height: 100%;
      min-height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
    }

    .game-canvas {
      position: absolute;
      border: none;
      width: 100%;
      height: 100%;
      touch-action: none;
      -ms-touch-action: none;
    }

    .game-canvas,
    .game-canvas:focus {
      outline: none;
    }
  </style>
  <style>
    /* First screen, before any script has loaded: `boot.tsx` removes it once the app has painted. */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      color: #f3e6c4;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.85) 80%),
        url('./backdrops/character-select.jpeg') center / cover no-repeat,
        #0d0b0a;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #boot-splash.bs-hide {
      opacity: 0;
    }

    #boot-splash .bs-logo {
      width: min(34vh, 180px);
      height: auto;
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(circle, #000 52%, transparent 70%);
      mask-image: radial-gradient(circle, #000 52%, transparent 70%);
      animation: bs-glow 2.4s ease-in-out infinite;
    }

    #boot-splash .bs-bar {
      width: min(60vw, 260px);
      height: 5px;
      overflow: hidden;
      border: 1px solid rgba(240, 210, 138, 0.6);
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.6);
    }

    #boot-splash .bs-bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #a97c25, #f6dc9a);
      animation: bs-slide 1.3s ease-in-out infinite;
    }

    #boot-splash .bs-line {
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e8d49a;
      text-shadow: 0 1px 4px #000;
    }

    #boot-splash .bs-rotate {
      display: none;
      max-width: 300px;
      margin-top: 10px;
      padding: 10px 16px;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(240, 210, 138, 0.7);
      border-radius: 14px;
    }

    @media (orientation: portrait) and (pointer: coarse) {
      #boot-splash .bs-rotate {
        display: block;
      }
    }

    @keyframes bs-slide {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(250%);
      }
    }

    @keyframes bs-glow {
      50% {
        filter: brightness(1.35);
      }
    }
  </style>
</head>

<body>
  <canvas class="game-canvas" width="400" height="300"></canvas>
  <div id="root"></div>
  <div id="boot-splash" role="status">
    <img class="bs-logo" src="./icons/icon-192.png" alt="MU" />
    <div class="bs-bar"></div>
    <div class="bs-line" id="bs-line">Loading...</div>
    <div class="bs-rotate" id="bs-rotate">Rotate your phone to landscape to play.</div>
  </div>
  <script>
    // Spanish when the browser is Spanish; the app's own text takes over once it loads.
    if (/^es/i.test(navigator.language || '')) {
      document.getElementById('bs-line').textContent = 'Cargando...';
      document.getElementById('bs-rotate').textContent = 'Gira tu celular a horizontal para jugar.';
    }
  </script>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
