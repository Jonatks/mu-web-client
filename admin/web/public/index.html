<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#12151d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e9ebf3" media="(prefers-color-scheme: light)">
<title>MU Admin</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="login" hidden>
  <form id="loginForm" class="login">
    <h1>MU Admin</h1>
    <p class="sub">Panel del servidor</p>
    <label>Usuario <input name="user" autocomplete="username" required></label>
    <label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Entrar</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</main>
<div id="app" class="shell" hidden>
  <aside>
    <div class="brand">MU Admin</div>
    <nav id="tabs">
      <button data-tab="accounts"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></span><span class="lb">Cuentas</span></button>
      <button data-tab="characters"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span><span class="lb">Personajes</span></button>
      <button data-tab="server"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></span><span class="lb">Servidor</span></button>
      <button data-tab="audit"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg></span><span class="lb">Registro</span></button>
    </nav>
    <div class="side-foot">
      <span id="gate" class="pill" title=""></span>
      <div class="who"><span id="who"></span><button id="logout" class="link">Salir</button></div>
    </div>
  </aside>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" popover="manual"></div>
<script src="app.js" type="module"></script>
</body>
</html>
